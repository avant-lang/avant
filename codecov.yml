# Soft comments only. A red native suite is still the merge gate.
# Do not fail PRs on a coverage percentage until the denominator is
# compiler/*.av only and we ask for a wall.
coverage:
  status:
    project: false
    patch: false
comment:
  layout: "condensed_header, files"
  require_changes: false
ignore:
  - "tests/**"
  - "src/**"
  - "runtime/**"
  - "examples/**"
  - "tools/**"
  - "spec/**"
