# AVANT_SEED_VERSION below is the published compiler. Its avant-linux-x86_64.tar.gz contains
# `avant`. This job asks that compiler to compile today's compiler/main.av
# and pass the suite, without coverage. It is the pull-request correctness
# gate. `native` compiles an instrumented B from the same pin and runs the
# suite on pull requests and on master, so Codecov can compare them.
# The suite is `avant test` with the default job count. Wave N kept that
# default: on a 4-CPU pin, `--jobs 1` was 188s and `--jobs 2` was 177s,
# against 168s for four jobs. The suite mains return before the checks
# when the runner is only listing parallel names. The old
# AVANT_TEST_JOBS=4 measurement compiled the stitched suite four times.
# AVANT_MYC_LLVM is the safepoints release (SAFEPOINTS_VERSION below), checked by
# sha256. This job does not install Crystal and does not compile myc-llvm.
#
# Runtime objects come from runtime/build.sh. `re2c` compiles a string
# literal at `re_compile`; computed patterns use PCRE2.

name: seed

env:
  AVANT_SEED_VERSION: v0.24.1
  AVANT_SEED_SHA256: 7c95a6d985aeb8f620cc78015d041a3ca27f9004aabeba1e32c2841c7950c750
  SAFEPOINTS_VERSION: v0.4.0
  MYC_LLVM_SHA256: 790472e25cd191b838271f6fae8b59eb1aa1e31f4c7ca7b7069eccbda0f29e5e

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: seed-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: llvm-config-20
      AVANT_ROOT: ${{ github.workspace }}
      AVANT_MYC_LLVM: /tmp/myc-llvm-linux-x86_64/myc-llvm
    steps:
      - uses: actions/checkout@v7

      - name: Prefer non-Azure Ubuntu mirrors
        run: bash .github/setup-apt-mirrors.sh

      - name: Install LLVM 20 and link libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            llvm-20-dev \
            libclang-20-dev \
            libpcre2-dev \
            zlib1g-dev \
            re2c

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Download ${{ env.AVANT_SEED_VERSION }} compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            "https://github.com/avant-lang/avant/releases/download/${AVANT_SEED_VERSION}/avant-linux-x86_64.tar.gz"
          echo "${AVANT_SEED_SHA256}  /tmp/avant-seed.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          test -x /tmp/avant-linux-x86_64/avant

      - name: Download safepoints ${{ env.SAFEPOINTS_VERSION }} myc-llvm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/myc-llvm-linux-x86_64.tar.gz \
            "https://github.com/avant-lang/safepoints/releases/download/${SAFEPOINTS_VERSION}/myc-llvm-linux-x86_64.tar.gz"
          echo "${MYC_LLVM_SHA256}  /tmp/myc-llvm-linux-x86_64.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/myc-llvm-linux-x86_64.tar.gz
          test -x /tmp/myc-llvm-linux-x86_64/myc-llvm

      - name: Seed compiles compiler A
        run: |
          set -euo pipefail
          /tmp/avant-linux-x86_64/avant compile compiler/main.av bin/avant-from-seed --debug
          ./bin/avant-from-seed run examples/hello.av

      - name: Native suite on the seed-built compiler
        env:
          AVANT_COMPILER: ./bin/avant-from-seed
        run: |
          set -euo pipefail
          ./bin/avant-from-seed test
