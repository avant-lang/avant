# AVANT_SEED_VERSION below is the published compiler. Its avant-linux-x86_64.tar.gz contains
# `avant`, whose one back end is the in-process LLVM linked into it
# (v0.36.0 is the first such seed). This job asks that compiler to
# compile today's compiler/main.av into B, B to compile it into C' (the
# same back end), and C' to
# pass the suite, without coverage (the suite's
# test_fixed_point builds D' with C' and compares their .ll). It is the
# pull-request correctness gate. `native` compiles an instrumented B from the same pin and runs the
# suite on pushes to any branch, so Codecov can compare them.
# The suite is `avant test` with the default job count, kept by
# measurement: on a 4-CPU pin, `--jobs 1` was 188s and `--jobs 2` was 177s,
# against 168s for four jobs. The suite mains return before the checks
# when the runner is only listing parallel names. The old
# AVANT_TEST_JOBS=4 measurement compiled the stitched suite four times.
# Until the file_read fix after v0.34.0, that default was 1 on GitHub
# runners: sysfs there reports 4096 bytes for /sys/devices/system/cpu/online,
# file_read trusted the size and failed, and the suite ran serially (the
# PR 48 seed log shows exclusive files interleaved in walk order).
# The seed is pinned by its sha256. This job does not install Crystal.
#
# Runtime objects come from runtime/build.sh. `re2c` (the pinned static
# build a release ships, tools/build-re2c.sh, in bin/re2c) compiles a string
# literal at `re_compile`; computed patterns use the vendored PCRE2.

name: seed

env:
  # The verify mode (the MIR verifier at stage final and LLVM's
  # verifier) for every compile CI makes.
  AVANT_VERIFY: "1"
  AVANT_SEED_VERSION: v0.49.0
  AVANT_SEED_SHA256: bba22d1f8a9c0e28235ba4122e1fc8da82803b486a9e1242c4ae314b9378c3e3

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: seed-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  seed:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: /opt/llvm-22.1.8/bin/llvm-config
      AVANT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Prefer non-Azure Ubuntu mirrors
        run: bash .github/setup-apt-mirrors.sh

      # The measuring server's toolchain at its exact versions
      # (.github/install-toolchain.sh): gcc 15.2.0-16ubuntu1 for the
      # runtime, binutils 2.46, libclang 20 for the bind helper and the
      # static zstd tools/build-llvm.sh merges, from a fixed
      # snapshot.ubuntu.com date; zlib1g-dev is also for examples/zlib.av,
      # which binds the system zlib itself.
      - name: Install the toolchain
        run: bash .github/install-toolchain.sh

      # LLVM 22.1.8, the compiler's in-process LLVM, is LLVM's official
      # release (Ubuntu's archive has 22.1.2): tools/install-llvm.sh checks
      # its sha256 and signature, and the job caches the 630 MB it keeps.
      # tools/build-llvm.sh merges it with libstdc++, zlib, and zstd into
      # runtime/build/avant_llvm.o, which only the compiler links.
      - name: Prepare the LLVM directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/llvm-22.1.8

      - name: Cache LLVM 22.1.8
        id: llvm
        uses: actions/cache@v4
        with:
          path: /opt/llvm-22.1.8
          key: llvm-22.1.8-linux-x64-${{ hashFiles('tools/install-llvm.sh') }}

      - name: Install LLVM 22.1.8
        if: steps.llvm.outputs.cache-hit != 'true'
        run: sh tools/install-llvm.sh /opt/llvm-22.1.8

      - name: Toolchain versions
        run: |
          echo "llvm: $("$LLVM_CONFIG" --version) ($LLVM_CONFIG)"
          echo "libclang (bind): $(llvm-config-20 --version)"
          echo "cc (link, compiler glue): $(cc --version | head -n 1)"
          echo "runtime cc: $(sh runtime/build.sh --cc) ($("$(sh runtime/build.sh --cc)" --version | head -n 1))"

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Build the bundled re2c
        # The static re2c a release ships (tools/build-re2c.sh), beside
        # bin/avant-b so the suite uses it.
        # It is also the runner's speed reference: .github/runner-speed.sh
        # prints the CPU model and count and the re2c make's seconds, by
        # which tools/ci-steps.py reads every step's time.
        run: sh .github/runner-speed.sh bin/re2c

      - name: Download ${{ env.AVANT_SEED_VERSION }} compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            "https://github.com/avant-lang/avant/releases/download/${AVANT_SEED_VERSION}/avant-linux-x86_64.tar.gz"
          echo "${AVANT_SEED_SHA256}  /tmp/avant-seed.tar.gz" | sha256sum -c -
          # Unpacked inside the checkout, as a developer's bin/vX: a seed
          # started from under the working directory links this tree's
          # runtime, which may export functions its own runtime lacks.
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          mkdir -p bin
          mv /tmp/avant-linux-x86_64 "bin/${AVANT_SEED_VERSION}"
          test -x "bin/${AVANT_SEED_VERSION}/avant"

      # tools/letters.sh holds the letters' one incantation: b is
      # the seed's build of compiler/main.av (bin/avant-b), c-llvm is B's
      # build
      # (bin/avant-c-llvm, C').
      - name: Seed → B → C'
        run: |
          set -euo pipefail
          LETTERS_SEED="bin/${AVANT_SEED_VERSION}" sh tools/letters.sh b c-llvm
          ./bin/avant-c-llvm run examples/hello.av

      - name: Native suite on C'
        env:
          AVANT_COMPILER: ./bin/avant-c-llvm
        run: |
          set -euo pipefail
          ./bin/avant-c-llvm test

      # The release layout (no myc-llvm), packaged here and installed by
      # the install-check job on an ubuntu-24.04 runner. C' links LLVM
      # statically.
      - name: Package the release layout
        run: |
          set -euo pipefail
          sh tools/package.sh dist bin/avant-c-llvm bin/re2c
          # The glibc floor: every symbol the shipped binaries need exists
          # in glibc 2.38 (tools/package.sh measures it).
          grep -qx 'glibc-floor: 2.38' dist/avant-linux-x86_64/versions.txt || { echo "glibc floor is not 2.38: $(grep glibc-floor dist/avant-linux-x86_64/versions.txt)" >&2; exit 1; }

      # The baseline x86-64: tools/package.sh refused an archive whose
      # binaries or runtime objects need a newer x86-64 (tools/isa-check.sh);
      # here the packaged compiler and three programs it compiles at the
      # default --cpu run on an emulated Nehalem (x86-64-v2: no AVX, no BMI),
      # since the runner itself has every newer instruction. qemu loads the
      # plain amd64 C library, not the runner's (.github/baseline-sysroot.sh).
      - name: Run the archive on an older x86-64 (qemu)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends qemu-user
          bash .github/baseline-sysroot.sh "$RUNNER_TEMP/baseline-root"
          QEMU_LD_PREFIX="$RUNNER_TEMP/baseline-root" sh tools/isa-check.sh --run dist/avant-linux-x86_64

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: seed-archive
          path: |
            dist/avant-linux-x86_64.tar.gz
            dist/avant-linux-x86_64.tar.gz.sha256

  # The archive installed on a real ubuntu-24.04 runner (glibc 2.39, the
  # oldest supported runner): install.sh from the built archive, then the
  # out-of-checkout smoke test on the installed compiler.
  install-check:
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download the archive
        uses: actions/download-artifact@v7
        with:
          name: seed-archive
          path: dist

      - name: Install and smoke-test the archive
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c avant-linux-x86_64.tar.gz.sha256)
          echo "runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(getconf GNU_LIBC_VERSION)"
          SHELL=/bin/bash AVANT_INTERNAL_DOWNLOAD_BASE="file://$PWD/dist" bash install.sh < /dev/null
          grep -q '^# avant$' ~/.bashrc
          sh tools/smoke.sh ~/.avant
