# AVANT_SEED_VERSION below is the published compiler. Its avant-linux-x86_64.tar.gz contains
# `avant` and its bundled `myc-llvm` backend. This job asks that compiler
# to compile today's compiler/main.av into B (on the old back end, the
# only one the seed has), B to compile it into C' on the new back end
# (the compiler's default since Stage 28 W10: in-process LLVM, no
# myc-llvm), and C' to pass the suite, without coverage (the suite's
# test_fixed_point builds D' with C' and compares their .ll). It is the
# pull-request correctness gate. `native` compiles an instrumented B from the same pin and runs the
# suite on pushes to any branch, so Codecov can compare them.
# The suite is `avant test` with the default job count. Wave N kept that
# default: on a 4-CPU pin, `--jobs 1` was 188s and `--jobs 2` was 177s,
# against 168s for four jobs. The suite mains return before the checks
# when the runner is only listing parallel names. The old
# AVANT_TEST_JOBS=4 measurement compiled the stitched suite four times.
# Until the file_read fix after v0.34.0, that default was 1 on GitHub
# runners: sysfs there reports 4096 bytes for /sys/devices/system/cpu/online,
# file_read trusted the size and failed, and the suite ran serially (the
# PR 48 seed log shows exclusive files interleaved in walk order).
# AVANT_MYC_LLVM is the seed's bundled myc-llvm (pinned by the seed's sha256;
# no separate safepoints download): the seed needs it to build B, and the
# suite's tests of the old back end (AVANT_BACKEND=myc) use it until that
# back end retires (W11). The new back end needs no myc-llvm. This job does
# not install Crystal and does not compile myc-llvm.
#
# Runtime objects come from runtime/build.sh. `re2c` (the pinned static
# build a release ships, tools/build-re2c.sh, in bin/re2c) compiles a string
# literal at `re_compile`; computed patterns use the vendored PCRE2.

name: seed

env:
  AVANT_SEED_VERSION: v0.34.0
  AVANT_SEED_SHA256: 9ab2e12f539d5eaa051232dbf0d95b5d4cd89769aeb68fa9adcae8954e42cfff

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: seed-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: llvm-config-20
      AVANT_ROOT: ${{ github.workspace }}
      AVANT_MYC_LLVM: /tmp/avant-linux-x86_64/myc-llvm
    steps:
      - uses: actions/checkout@v7

      - name: Prefer non-Azure Ubuntu mirrors
        run: bash .github/setup-apt-mirrors.sh

      # The seed's myc-llvm has LLVM linked in and needs nothing from apt.
      # libclang (with llvm-config, from llvm-20) is for the bind
      # helper that runtime/build.sh builds and the release ships; zlib1g-dev
      # is for examples/zlib.av, which binds the system zlib itself.
      # llvm-20-dev (static LLVM archives) and libzstd-dev are for
      # tools/build-llvm.sh, which runtime/build.sh runs: it merges LLVM 20
      # with libstdc++, zlib, and zstd into runtime/build/avant_llvm.o, the
      # in-process LLVM only the compiler links (D172, D173).
      - name: Install the C toolchain and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            llvm-20 \
            llvm-20-dev \
            libclang-20-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Build the bundled re2c
        # The static re2c a release ships (D151, tools/build-re2c.sh), beside
        # bin/avant-b so the suite uses it (D150).
        run: sh tools/build-re2c.sh bin/re2c

      - name: Download ${{ env.AVANT_SEED_VERSION }} compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            "https://github.com/avant-lang/avant/releases/download/${AVANT_SEED_VERSION}/avant-linux-x86_64.tar.gz"
          echo "${AVANT_SEED_SHA256}  /tmp/avant-seed.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          test -x /tmp/avant-linux-x86_64/avant
          test -x /tmp/avant-linux-x86_64/myc-llvm

      # tools/letters.sh holds the letters' one incantation (D190): b is
      # the seed's build of compiler/main.av (bin/avant-b), c-llvm is B's
      # build on the new back end (bin/avant-c-llvm, C').
      - name: Seed → B → C'
        run: |
          set -euo pipefail
          LETTERS_SEED=/tmp/avant-linux-x86_64 sh tools/letters.sh b c-llvm
          env -u AVANT_MYC_LLVM ./bin/avant-c-llvm run examples/hello.av

      - name: Native suite on C'
        env:
          AVANT_COMPILER: ./bin/avant-c-llvm
        run: |
          set -euo pipefail
          ./bin/avant-c-llvm test

      # The release layout (no myc-llvm, Stage 28 W10), installed by
      # install.sh into a clean container (only gcc and libc6-dev; no LLVM,
      # PCRE2, zlib headers, re2c, or myc-llvm) and smoke-tested outside
      # any checkout (D147). C' links LLVM statically (D190).
      - name: Install the release layout in a clean container
        run: |
          set -euo pipefail
          sh tools/package.sh /tmp/dist bin/avant-c-llvm bin/re2c
          sh tools/container-test.sh ubuntu:24.04 /tmp/dist
