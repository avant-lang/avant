# Q52 proof. Not the merge gate. native.yml still builds A with Crystal.
#
# Two pins. v0.1.0 is the asset that already passed (binary avant-av-b).
# v0.4.0 is the published pre-release (binary avant inside
# avant-linux-x86_64.tar.gz). Both must compile today's compiler/main.av
# and pass the suite. native switches only after v0.4.0 is the one we keep.
#
# myc-llvm is still built with Crystal (Q53-A). Runtime objects come from
# runtime/build.sh, not from crystal src/cli.cr.

name: seed

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: seed-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v0.1.0
            asset: avant-av-b-linux-x86_64.tar.gz
            bin: avant-av-b
          - name: v0.4.0
            asset: avant-linux-x86_64.tar.gz
            bin: avant
    env:
      LLVM_CONFIG: llvm-config-20
      AVANT_ROOT: ${{ github.workspace }}
      AVANT_MYC_LLVM: ${{ github.workspace }}/safepoints/myc-llvm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: avant-lang/safepoints
          path: safepoints
          persist-credentials: false

      - name: Install LLVM 20 and link libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            llvm-20-dev \
            libclang-20-dev \
            libpcre2-dev \
            zlib1g-dev

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21"

      - name: Build myc-llvm
        working-directory: safepoints
        run: |
          shards install
          crystal build src/cli.cr -o myc-llvm

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Download ${{ matrix.name }} compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            "https://github.com/avant-lang/avant/releases/download/${{ matrix.name }}/${{ matrix.asset }}"
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          test -x "/tmp/avant-linux-x86_64/${{ matrix.bin }}"

      - name: Seed compiles compiler A
        run: |
          set -euo pipefail
          "/tmp/avant-linux-x86_64/${{ matrix.bin }}" compile compiler/main.av bin/avant-from-seed
          ./bin/avant-from-seed run examples/hello.av

      - name: Native suite on the seed-built compiler
        env:
          AVANT_COMPILER: ./bin/avant-from-seed
        run: |
          set -euo pipefail
          ./bin/avant-from-seed run tests/run.av | tee native.log
          if grep -q 'FAIL  tests/run.av' native.log; then
            exit 1
          fi
          if grep -qE 'Test Suites:.*failed' native.log; then
            exit 1
          fi
          grep -qE 'Test Suites: [0-9]+ passed, [0-9]+ total' native.log
          grep -q 'Ran all test suites.' native.log
