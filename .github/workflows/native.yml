# Coverage suite. The seed workflow runs the same suite without coverage
# and with AVANT_TEST_JOBS. This job runs it on an instrumented B, on
# pull requests and on pushes to master: Codecov compares the pull
# request report with the master report. An instrumented B makes every
# child compile pay for coverage (suite 365s against 159-183s
# uninstrumented on the same runner image).
#
# The seed is the published asset avant-linux-x86_64.tar.gz. `avant` in
# that asset compiles compiler/main.av into B with coverage on.
# `myc-llvm` is the safepoints release (SAFEPOINTS_VERSION below), checked by sha256.
# This job does not install Crystal and does not compile myc-llvm.
# AVANT_MYC_LLVM points at the extracted backend.
# Runtime objects come from runtime/build.sh.
#
# `re2c` is a build tool, like `cc`. A string literal at `re_compile` is
# compiled with it and linked in. Without `re2c` that call stays on PCRE2.
# Computed patterns always use PCRE2 (`libpcre2-dev`).
#
# Tag pushes are `release.yml` (the seed builds that binary too,
# with this same safepoints myc-llvm). Since Wave G the Avant
# asset bundles myc-llvm beside avant; this job still uses its own
# hash-pinned backend through AVANT_MYC_LLVM.
# `native` also writes junit.xml and lcov.info (soft Codecov; not the
# merge gate). Suite sets AVANT_COVERAGE_REPORT=0; the compiler CLI is
# quiet anyway so `run FILE.av` stdout stays the program. A
# `--coverage` fixture still prints. The suite runs sequentially
# here (no AVANT_TEST_JOBS): parallel shard processes would run
# several instrumented compilers against one shared coverage map.
# Push is `master` only so a same-repo PR is not a second identical run
# (tags never hit this workflow).

name: native

env:
  AVANT_SEED_VERSION: v0.20.0
  AVANT_SEED_SHA256: 0974c44ff41ff01656d14d624813144b5d9a5097b9177dee3ecca85061f78d5c
  SAFEPOINTS_VERSION: v0.4.0
  MYC_LLVM_SHA256: 790472e25cd191b838271f6fae8b59eb1aa1e31f4c7ca7b7069eccbda0f29e5e

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: llvm-config-20
      AVANT_ROOT: ${{ github.workspace }}
      AVANT_MYC_LLVM: /tmp/myc-llvm-linux-x86_64/myc-llvm
    steps:
      - uses: actions/checkout@v7

      - name: Prefer non-Azure Ubuntu mirrors
        run: bash .github/setup-apt-mirrors.sh

      - name: Install LLVM 20 and link libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            llvm-20-dev \
            libclang-20-dev \
            libpcre2-dev \
            zlib1g-dev \
            re2c

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Download ${{ env.AVANT_SEED_VERSION }} compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            "https://github.com/avant-lang/avant/releases/download/${AVANT_SEED_VERSION}/avant-linux-x86_64.tar.gz"
          echo "${AVANT_SEED_SHA256}  /tmp/avant-seed.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          test -x /tmp/avant-linux-x86_64/avant

      - name: Download safepoints ${{ env.SAFEPOINTS_VERSION }} myc-llvm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/myc-llvm-linux-x86_64.tar.gz \
            "https://github.com/avant-lang/safepoints/releases/download/${SAFEPOINTS_VERSION}/myc-llvm-linux-x86_64.tar.gz"
          echo "${MYC_LLVM_SHA256}  /tmp/myc-llvm-linux-x86_64.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/myc-llvm-linux-x86_64.tar.gz
          test -x /tmp/myc-llvm-linux-x86_64/myc-llvm

      - name: Seed → B
        env:
          AVANT_COVERAGE: "1"
          AVANT_COVERAGE_MAP: ${{ github.workspace }}/coverage.map
        run: |
          set -euo pipefail
          /tmp/avant-linux-x86_64/avant compile compiler/main.av bin/avant-av-b --debug

      # Do not inherit AVANT_COVERAGE here. B would compile hello with
      # coverage and overwrite coverage.map, and the suite would then
      # report examples/hello.av instead of compiler/*.av.
      - name: Smoke hello
        run: ./bin/avant-av-b run examples/hello.av

      - name: Native suite on B
        env:
          AVANT_COMPILER: ./bin/avant-av-b
          AVANT_JUNIT: junit.xml
          AVANT_COVERAGE_LCOV: lcov.info
          AVANT_COVERAGE_REPORT: "0"
        run: |
          set -euo pipefail
          ./bin/avant-av-b run tests/run.av | tee native.log
          if grep -q 'FAIL  tests/run.av' native.log; then
            exit 1
          fi
          if grep -qE 'Test Suites:.*failed' native.log; then
            exit 1
          fi
          grep -qE 'Test Suites: [0-9]+ passed, [0-9]+ total' native.log
          grep -q 'Ran all test suites.' native.log

      - name: Upload LCOV and JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-reports
          path: |
            junit.xml
            lcov.info
          if-no-files-found: warn

      - name: Codecov coverage (soft)
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          disable_search: true

      - name: Codecov test analytics (soft)
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false
          disable_search: true
