# Coverage suite. The seed workflow runs the same suite without coverage.
# Both use `avant test` and the default job count. Wave N measured that
# default against smaller counts and kept it: on a 4-CPU pin, `--jobs 1`
# was 188s and `--jobs 2` was 177s, against 168s for four jobs. On 16
# threads, `--jobs 1` was 194s and `--jobs 8` was 163s, against 153s for
# the default. The suite mains return before the checks when the runner
# is only listing parallel names, so each file's checks run once.
# The old four-job measurement compiled the stitched suite four times.
# Until the file_read fix after v0.34.0, that default was 1 on GitHub
# runners: sysfs there reports 4096 bytes for /sys/devices/system/cpu/online,
# file_read trusted the size and failed, and the suite ran serially (the
# PR 48 seed log shows exclusive files interleaved in walk order).
# This job runs the suite on an instrumented B on
# pushes to any branch: Codecov compares the pull
# request report with the master report, and branch pushes give feature
# branches their own coverage and test-analytics data. An instrumented B makes every
# child compile pay for coverage (suite 365s against 159-183s
# uninstrumented on the same runner image).
#
# The seed is the published asset avant-linux-x86_64.tar.gz (pinned by
# its sha256). `avant` in that asset compiles compiler/main.av into B with
# coverage on, on its one back end, the in-process LLVM linked into it
# (D172; since v0.36.0 every seed is built that way, D178). B has the same
# back end, so B is the compiler C' would be, instrumented.
# This job does not install Crystal.
# Runtime objects come from runtime/build.sh.
#
# `re2c` is a build tool, like `cc`. A string literal at `re_compile` is
# compiled with it and linked in. The job builds the pinned static re2c a
# release ships (tools/build-re2c.sh) into bin/re2c, beside the compiler.
# Computed patterns use PCRE2, vendored in runtime/third_party/pcre2 (D146).
#
# Tag pushes are `release.yml` (the same seed builds B there, and B the
# shipped compiler on the new back end).
# `native` also writes junit.xml and coverage/lcov.info (soft Codecov; not the
# merge gate). Suite sets AVANT_COVERAGE_REPORT=0; the compiler CLI is
# quiet anyway so `run FILE.av` stdout stays the program.
# `AVANT_COVERAGE_REPORT=0` also hides the table of a covered program.
# Hit counters are one shared map.
# The suite sets AVANT_COVERAGE_LCOV=0. A later step writes coverage/lcov.info
# once, after those processes have exited.
# Push runs on every branch so branch uploads reach Codecov. There is
# no pull_request trigger: a same-repo PR is covered by the push of its
# head branch, seed is the pull-request correctness gate, and one run
# per commit is enough for Codecov (tags never hit this workflow).

name: native

env:
  AVANT_SEED_VERSION: v0.41.0
  AVANT_SEED_SHA256: 3c55ba6433106e65085893edf2c0fb4aa6d97baee6b67d880a70fa3504318f67

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: llvm-config-20
      AVANT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Prefer non-Azure Ubuntu mirrors
        run: bash .github/setup-apt-mirrors.sh

      # libclang (with llvm-config, from llvm-20) is for the bind
      # helper that runtime/build.sh builds and the release ships; zlib1g-dev
      # is for examples/zlib.av, which binds the system zlib itself.
      # llvm-20-dev (static LLVM archives) and libzstd-dev are for
      # tools/build-llvm.sh, which runtime/build.sh runs: it merges LLVM 20
      # with libstdc++, zlib, and zstd into runtime/build/avant_llvm.o, the
      # in-process LLVM only the compiler links (D172, D173).
      - name: Install the C toolchain and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            llvm-20 \
            llvm-20-dev \
            libclang-20-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Build the bundled re2c
        # The static re2c a release ships (D151, tools/build-re2c.sh), beside
        # bin/avant-b so the suite uses it (D150).
        run: sh tools/build-re2c.sh bin/re2c

      - name: Download ${{ env.AVANT_SEED_VERSION }} compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            "https://github.com/avant-lang/avant/releases/download/${AVANT_SEED_VERSION}/avant-linux-x86_64.tar.gz"
          echo "${AVANT_SEED_SHA256}  /tmp/avant-seed.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          test -x /tmp/avant-linux-x86_64/avant

      - name: Seed → B
        env:
          AVANT_COVERAGE: "1"
          AVANT_COVERAGE_MAP: ${{ github.workspace }}/coverage.map
        run: |
          set -euo pipefail
          /tmp/avant-linux-x86_64/avant compile compiler/main.av bin/avant-b --debug runtime/build/avant_llvm.o

      # Do not inherit AVANT_COVERAGE here. B would compile hello with
      # coverage and overwrite coverage.map, and the suite would then
      # report examples/hello.av instead of compiler/*.av.
      - name: Smoke hello
        run: ./bin/avant-b run examples/hello.av

      - name: Native suite on B
        env:
          AVANT_COMPILER: ./bin/avant-b
          AVANT_COVERAGE_LCOV: "0"
          AVANT_COVERAGE_REPORT: "0"
        run: |
          set -euo pipefail
          ./bin/avant-b test --junit junit.xml

      # One writer. The suite left the hit file complete and did not open
      # coverage/lcov.info. This process reads that file and writes the report.
      - name: Write coverage report
        if: always()
        env:
          AVANT_COVERAGE_LCOV: coverage/lcov.info
          AVANT_COVERAGE_REPORT: "0"
        run: |
          if [ -x ./bin/avant-b ]; then
            ./bin/avant-b help
          fi

      - name: Upload LCOV and JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-reports
          path: |
            junit.xml
            coverage/lcov.info
          if-no-files-found: warn

      - name: Codecov coverage (soft)
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
          disable_search: true

      - name: Codecov test analytics (soft)
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false
          disable_search: true
