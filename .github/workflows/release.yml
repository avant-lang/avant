# On a version tag: the seed (AVANT_SEED_VERSION below) builds B, the suite runs on B,
# then a draft GitHub Release is opened with the linux-x86_64 compiler.
#
# The seed is the avant-linux-x86_64.tar.gz asset of AVANT_SEED_VERSION. It contains `avant`.
# `myc-llvm` is the safepoints release (SAFEPOINTS_VERSION below), checked by sha256, and is
# bundled beside `avant` in the new asset (Wave G). This job does not
# install Crystal and does not compile myc-llvm.
# Runtime objects come from runtime/build.sh.
# `re2c` compiles a string literal at `re_compile`; computed patterns use PCRE2.
# The release bundles a static re2c built from the pinned upstream release.
#
# The asset is `avant-linux-x86_64.tar.gz`. Inside it, the compiler
# is named `avant`. Do not dispatch this workflow onto the seed tag
# (AVANT_SEED_VERSION): that tag's asset is the seed, and an upload would replace it.
#
# The suite runs before any release is created. It is `avant test` with
# the default job count. Wave N kept that default: on a 4-CPU pin,
# `--jobs 1` was 188s and `--jobs 2` was 177s, against 168s for four
# jobs. The suite mains return before the checks when the runner is only
# listing parallel names. The old AVANT_TEST_JOBS=4 measurement compiled
# the stitched suite four times.
# Until the file_read fix after v0.33.0, that default was 1 on GitHub
# runners: sysfs there reports 4096 bytes for /sys/devices/system/cpu/online,
# file_read trusted the size and failed, and the suite ran serially (the
# PR 48 seed log shows exclusive files interleaved in walk order).
# A new tag becomes a
# draft (`gh release create --draft`). Publishing the draft is a
# separate act. Git tags cannot hold files.
#
# Backfill an existing tag from Actions: Run workflow → tag name.
# An existing release is uploaded in place; it is not flipped to draft.

name: release-binary

env:
  AVANT_SEED_VERSION: v0.33.0
  AVANT_SEED_SHA256: 4b2710e51ccbb13a0e3678aecc7f645b0c76326fabe09e3a14013900e8f2cc21
  SAFEPOINTS_VERSION: v0.5.0
  MYC_LLVM_SHA256: 0b04ce07501234ca4ee18b2c52f2309884fc7d00f3cec036757493a76c8a507d

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach (not the seed tag)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-binary-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: llvm-config-20
      AVANT_ROOT: ${{ github.workspace }}
      AVANT_MYC_LLVM: /tmp/myc-llvm-linux-x86_64/myc-llvm
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check tag against avant.toml version
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' avant.toml | head -n 1)"
          if [ -z "${manifest_version}" ]; then
            echo "release: no version found in avant.toml" >&2
            exit 1
          fi
          if [ "v${manifest_version}" != "${TAG_NAME}" ]; then
            echo "release: tag ${TAG_NAME} does not match avant.toml version ${manifest_version} (want v${manifest_version})" >&2
            exit 1
          fi
          echo "release: tag ${TAG_NAME} matches avant.toml version ${manifest_version}"

      - name: Prefer non-Azure Ubuntu mirrors
        run: bash .github/setup-apt-mirrors.sh

      - name: Install LLVM 20 and link libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            llvm-20-dev \
            libclang-20-dev \
            zlib1g-dev

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Build the bundled re2c
        # The static re2c a release ships (D151, tools/build-re2c.sh), beside
        # bin/avant-b so the suite uses it (D150).
        run: sh tools/build-re2c.sh bin/re2c

      - name: Download ${{ env.AVANT_SEED_VERSION }} compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            "https://github.com/avant-lang/avant/releases/download/${AVANT_SEED_VERSION}/avant-linux-x86_64.tar.gz"
          echo "${AVANT_SEED_SHA256}  /tmp/avant-seed.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          test -x /tmp/avant-linux-x86_64/avant

      - name: Download safepoints ${{ env.SAFEPOINTS_VERSION }} myc-llvm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/myc-llvm-linux-x86_64.tar.gz \
            "https://github.com/avant-lang/safepoints/releases/download/${SAFEPOINTS_VERSION}/myc-llvm-linux-x86_64.tar.gz"
          echo "${MYC_LLVM_SHA256}  /tmp/myc-llvm-linux-x86_64.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/myc-llvm-linux-x86_64.tar.gz
          test -x /tmp/myc-llvm-linux-x86_64/myc-llvm

      - name: Seed → B
        run: |
          set -euo pipefail
          /tmp/avant-linux-x86_64/avant compile compiler/main.av bin/avant-b --debug
          ./bin/avant-b run examples/hello.av

      - name: Native suite on B
        env:
          AVANT_COMPILER: ./bin/avant-b
        run: |
          set -euo pipefail
          ./bin/avant-b test

      - name: Package linux-x86_64 B
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "tag: ${TAG_NAME}"
            echo "avant: $(git rev-parse HEAD)"
            echo "myc-llvm: https://github.com/avant-lang/safepoints/releases/download/${SAFEPOINTS_VERSION}/myc-llvm-linux-x86_64.tar.gz"
            echo "myc-llvm-sha256: ${MYC_LLVM_SHA256}"
            if [ -f /tmp/myc-llvm-linux-x86_64/versions.txt ]; then
              echo "myc-llvm-origin:"
              sed 's/^/  /' /tmp/myc-llvm-linux-x86_64/versions.txt
            fi
            echo "llvm: $(llvm-config-20 --version)"
            echo "runner: ubuntu-24.04 linux-x86_64"
            echo "built-by: ${AVANT_SEED_VERSION}"
            echo "seed: yes"
            echo "binary: avant"
            echo "bundled: myc-llvm (safepoints ${SAFEPOINTS_VERSION}) beside avant"
            echo "bundled: avant-bind (tools/bind.c, libclang $(llvm-config-20 --version)) beside avant"
            echo "bundled: re2c ($(bin/re2c --version), static, tools/build-re2c.sh) beside avant"
          } | tee dist/versions.txt
          # The layout is tools/package.sh's (D148), the same script local proofs use.
          sh tools/package.sh dist bin/avant-b /tmp/myc-llvm-linux-x86_64/myc-llvm bin/re2c dist/versions.txt
          cat dist/avant-linux-x86_64.tar.gz.sha256
          sh tools/container-test.sh ubuntu:24.04 dist
          cp install.sh dist/install.sh
          {
            echo "linux-x86_64 compiler \`avant\`."
            echo
            echo "Install: \`curl -fsSL https://github.com/avant-lang/avant/releases/latest/download/install.sh | bash\` (or extract this archive and put its directory on PATH)."
            echo
            echo "Built by the ${AVANT_SEED_VERSION} seed. The archive carries \`avant\`, its \`myc-llvm\` backend (safepoints ${SAFEPOINTS_VERSION}, LLVM linked in), \`re2c\`, the \`avant-bind\` helper, the standard library, and the runtime (PCRE2 and zlib inside)."
            echo "Compiling a program needs a C compiler and the C library development files (Debian/Ubuntu: gcc libc6-dev; Fedora: gcc glibc-devel), and glibc at or above the \`glibc-floor\` below. \`avant bind\` also needs libclang 20."
            echo "This asset can be the next compiler pin after it is published. It is not the oracle."
            echo
            cat dist/avant-linux-x86_64/versions.txt
            echo
            echo '```'
            cat dist/avant-linux-x86_64.tar.gz.sha256
            echo '```'
          } > dist/notes.md

      - name: Attach to GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" \
              dist/avant-linux-x86_64.tar.gz \
              dist/avant-linux-x86_64.tar.gz.sha256 \
              dist/install.sh \
              --clobber
          else
            gh release create "${TAG_NAME}" \
              dist/avant-linux-x86_64.tar.gz \
              dist/avant-linux-x86_64.tar.gz.sha256 \
              dist/install.sh \
              --title "${TAG_NAME}" \
              --notes-file dist/notes.md \
              --draft \
              --verify-tag
          fi
