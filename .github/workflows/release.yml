# On a version tag: the seed (AVANT_SEED_VERSION below) builds B, B builds the
# shipped compiler with --release (bin/avant-c-release), the suite runs on
# it, then a draft GitHub Release is opened with
# the linux-x86_64 compiler.
#
# The seed is the avant-linux-x86_64.tar.gz asset of AVANT_SEED_VERSION
# (pinned by its sha256). Like the asset this job builds, it holds `avant`
# with its one back end, the in-process LLVM linked into it (the old
# back end is retired, and v0.36.0 is the first seed without
# it). This job does not install Crystal.
# Runtime objects come from runtime/build.sh.
# `re2c` compiles a string literal at `re_compile`; computed patterns use PCRE2.
# The release bundles a static re2c built from the pinned upstream release.
#
# The asset is `avant-linux-x86_64.tar.gz`. Inside it, the compiler
# is named `avant`. Do not dispatch this workflow onto the seed tag
# (AVANT_SEED_VERSION): that tag's asset is the seed, and an upload would replace it.
#
# The suite runs before any release is created. It is `avant test` with
# the default job count, kept by measurement: on a 4-CPU pin,
# `--jobs 1` was 188s and `--jobs 2` was 177s, against 168s for four
# jobs. The suite mains return before the checks when the runner is only
# listing parallel names. The old AVANT_TEST_JOBS=4 measurement compiled
# the stitched suite four times.
# Until the file_read fix after v0.34.0, that default was 1 on GitHub
# runners: sysfs there reports 4096 bytes for /sys/devices/system/cpu/online,
# file_read trusted the size and failed, and the suite ran serially (the
# PR 48 seed log shows exclusive files interleaved in walk order).
# A new tag becomes a
# draft (`gh release create --draft`). Publishing the draft is a
# separate act. Git tags cannot hold files.
#
# Backfill an existing tag from Actions: Run workflow → tag name.
# An existing release is uploaded in place; it is not flipped to draft.

name: release-binary

env:
  AVANT_SEED_VERSION: v0.44.0
  AVANT_SEED_SHA256: dcc76bf2e7560e6bd85c1e005de1807aa6e281362bca15f76f721eb6c113c22b

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach (not the seed tag)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-binary-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: /opt/llvm-22.1.8/bin/llvm-config
      AVANT_ROOT: ${{ github.workspace }}
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check tag against avant.toml version
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' avant.toml | head -n 1)"
          if [ -z "${manifest_version}" ]; then
            echo "release: no version found in avant.toml" >&2
            exit 1
          fi
          if [ "v${manifest_version}" != "${TAG_NAME}" ]; then
            echo "release: tag ${TAG_NAME} does not match avant.toml version ${manifest_version} (want v${manifest_version})" >&2
            exit 1
          fi
          echo "release: tag ${TAG_NAME} matches avant.toml version ${manifest_version}"

      - name: Prefer non-Azure Ubuntu mirrors
        run: bash .github/setup-apt-mirrors.sh

      # The measuring server's toolchain at its exact versions
      # (.github/install-toolchain.sh): gcc 15.2.0-16ubuntu1 for the
      # runtime, binutils 2.46, libclang 20 for the bind helper and the
      # static zstd tools/build-llvm.sh merges, from a fixed
      # snapshot.ubuntu.com date; zlib1g-dev is also for examples/zlib.av,
      # which binds the system zlib itself.
      - name: Install the toolchain
        run: bash .github/install-toolchain.sh

      # LLVM 22.1.8, the compiler's in-process LLVM, is LLVM's official
      # release (Ubuntu's archive has 22.1.2): tools/install-llvm.sh checks
      # its sha256 and signature, and the job caches the 350 MB it keeps.
      # tools/build-llvm.sh merges it with libstdc++, zlib, and zstd into
      # runtime/build/avant_llvm.o, which only the compiler links.
      - name: Prepare the LLVM directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/llvm-22.1.8

      - name: Cache LLVM 22.1.8
        id: llvm
        uses: actions/cache@v4
        with:
          path: /opt/llvm-22.1.8
          key: llvm-22.1.8-linux-x64-${{ hashFiles('tools/install-llvm.sh') }}

      - name: Install LLVM 22.1.8
        if: steps.llvm.outputs.cache-hit != 'true'
        run: sh tools/install-llvm.sh /opt/llvm-22.1.8

      - name: Toolchain versions
        run: |
          echo "llvm: $("$LLVM_CONFIG" --version) ($LLVM_CONFIG)"
          echo "libclang (bind): $(llvm-config-20 --version)"
          echo "cc: $(cc --version | head -n 1)"

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Build the bundled re2c
        # The static re2c a release ships (tools/build-re2c.sh), beside
        # bin/avant-b so the suite uses it.
        run: sh tools/build-re2c.sh bin/re2c

      - name: Download ${{ env.AVANT_SEED_VERSION }} compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            "https://github.com/avant-lang/avant/releases/download/${AVANT_SEED_VERSION}/avant-linux-x86_64.tar.gz"
          echo "${AVANT_SEED_SHA256}  /tmp/avant-seed.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          test -x /tmp/avant-linux-x86_64/avant

      # tools/letters.sh holds the letters' one incantation: b is
      # the seed's build of compiler/main.av (bin/avant-b), c-release is
      # B's build with
      # --release (bin/avant-c-release), the compiler this release ships.
      - name: Seed → B → the shipped compiler
        run: |
          set -euo pipefail
          LETTERS_SEED=/tmp/avant-linux-x86_64 sh tools/letters.sh b c-release
          ./bin/avant-c-release run examples/hello.av

      - name: Native suite on the shipped compiler
        env:
          AVANT_COMPILER: ./bin/avant-c-release
        run: |
          set -euo pipefail
          ./bin/avant-c-release test

      - name: Package linux-x86_64
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "tag: ${TAG_NAME}"
            echo "avant: $(git rev-parse HEAD)"
            echo "llvm: $("$LLVM_CONFIG" --version) (LLVM's official release, tools/install-llvm.sh)"
            echo "runner: ubuntu-26.04 linux-x86_64, $(cc --version | head -n 1)"
            echo "built-by: B (the ${AVANT_SEED_VERSION} seed's build of this tree), on the in-process LLVM back end, --release"
            echo "backend: in-process LLVM $("$LLVM_CONFIG" --version), linked into avant (runtime/avant_llvm.c, tools/build-llvm.sh); no myc-llvm"
            echo "seed: yes"
            echo "binary: avant"
            echo "bundled: avant-bind (tools/bind.c, libclang $(llvm-config-20 --version)) beside avant"
            echo "bundled: re2c ($(bin/re2c --version), static, tools/build-re2c.sh) beside avant"
          } | tee dist/versions.txt
          # The layout is tools/package.sh's, the same script local proofs use.
          sh tools/package.sh dist bin/avant-c-release bin/re2c dist/versions.txt
          cat dist/avant-linux-x86_64.tar.gz.sha256
          # The glibc floor: every symbol the shipped binaries need exists
          # in glibc 2.38 (tools/package.sh measures it).
          grep -qx 'glibc-floor: 2.38' dist/avant-linux-x86_64/versions.txt || { echo "glibc floor is not 2.38: $(grep glibc-floor dist/avant-linux-x86_64/versions.txt)" >&2; exit 1; }
          cp install.sh dist/install.sh
          {
            echo "linux-x86_64 compiler \`avant\`."
            echo
            echo "Install: \`curl -fsSL https://github.com/avant-lang/avant/releases/latest/download/install.sh | bash\` (or extract this archive and put its directory on PATH)."
            echo
            echo "Built from the ${AVANT_SEED_VERSION} seed through B. The archive carries \`avant\` (LLVM linked in: no \`myc-llvm\` and no other backend process), \`re2c\`, the \`avant-bind\` helper, the standard library, and the runtime (PCRE2 and zlib inside)."
            echo "Compiling a program needs a C compiler and the C library development files (Debian/Ubuntu: gcc libc6-dev; Fedora: gcc glibc-devel), and glibc at or above the \`glibc-floor\` below. \`avant bind\` also needs libclang 20."
            echo "This asset can be the next compiler pin after it is published. It is not the oracle."
            echo
            cat dist/avant-linux-x86_64/versions.txt
            echo
            echo '```'
            cat dist/avant-linux-x86_64.tar.gz.sha256
            echo '```'
          } > dist/notes.md

      # The baseline x86-64: tools/package.sh refused an archive whose
      # binaries or runtime objects need a newer x86-64 (tools/isa-check.sh);
      # here the packaged compiler and three programs it compiles at the
      # default --cpu run on an emulated Nehalem (x86-64-v2: no AVX, no BMI),
      # since the runner itself has every newer instruction. qemu loads the
      # plain amd64 C library, not the runner's (.github/baseline-sysroot.sh).
      - name: Run the archive on an older x86-64 (qemu)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends qemu-user
          bash .github/baseline-sysroot.sh "$RUNNER_TEMP/baseline-root"
          QEMU_LD_PREFIX="$RUNNER_TEMP/baseline-root" sh tools/isa-check.sh --run dist/avant-linux-x86_64

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: |
            dist/avant-linux-x86_64.tar.gz
            dist/avant-linux-x86_64.tar.gz.sha256
            dist/install.sh
            dist/notes.md

  # The archive installed on a real ubuntu-24.04 runner (glibc 2.39, the
  # oldest supported runner): install.sh from the built archive, then the
  # out-of-checkout smoke test on the installed compiler.
  install-check:
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download the archive
        uses: actions/download-artifact@v7
        with:
          name: release-archive
          path: dist

      - name: Install and smoke-test the archive
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c avant-linux-x86_64.tar.gz.sha256)
          echo "runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(getconf GNU_LIBC_VERSION)"
          SHELL=/bin/bash AVANT_INTERNAL_DOWNLOAD_BASE="file://$PWD/dist" bash install.sh < /dev/null
          grep -q '^# avant$' ~/.bashrc
          sh tools/smoke.sh ~/.avant

  # Attached only once the archive installed and passed its smoke test on
  # ubuntu-24.04.
  publish:
    needs: [binary, install-check]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download the release files
        uses: actions/download-artifact@v7
        with:
          name: release-archive
          path: dist

      - name: Attach to GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" \
              dist/avant-linux-x86_64.tar.gz \
              dist/avant-linux-x86_64.tar.gz.sha256 \
              dist/install.sh \
              --clobber
          else
            gh release create "${TAG_NAME}" \
              dist/avant-linux-x86_64.tar.gz \
              dist/avant-linux-x86_64.tar.gz.sha256 \
              dist/install.sh \
              --title "${TAG_NAME}" \
              --notes-file dist/notes.md \
              --draft \
              --verify-tag
          fi
