# On a version tag: the v0.9.0 seed builds B, the suite runs on B,
# then a draft GitHub Release is opened with the linux-x86_64 compiler.
#
# The seed is avant-linux-x86_64.tar.gz from v0.9.0. It contains `avant`
# and the prebuilt `myc-llvm`. This job uses that backend as
# AVANT_MYC_LLVM and ships the same binary in the new asset. It does not
# install Crystal and does not compile myc-llvm.
# Runtime objects come from runtime/build.sh.
# `re2c` compiles a string literal at `re_compile`; computed patterns use PCRE2.
#
# The asset is `avant-linux-x86_64.tar.gz`. Inside it, the compiler
# is named `avant`. Do not dispatch this workflow onto v0.9.0: that
# tag's asset is the seed, and an upload would replace it.
#
# The suite runs before any release is created. A new tag becomes a
# draft (`gh release create --draft`). Publishing the draft is a
# separate act. Git tags cannot hold files.
#
# Backfill an existing tag from Actions: Run workflow → tag name.
# An existing release is uploaded in place; it is not flipped to draft.

name: release-binary

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach (not v0.9.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-binary-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: llvm-config-20
      AVANT_ROOT: ${{ github.workspace }}
      AVANT_MYC_LLVM: /tmp/avant-linux-x86_64/myc-llvm
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install LLVM 20 and link libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            llvm-20-dev \
            libclang-20-dev \
            libpcre2-dev \
            zlib1g-dev \
            re2c

      - name: Build runtime objects
        run: sh runtime/build.sh

      - name: Download v0.9.0 compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/avant-seed.tar.gz \
            https://github.com/avant-lang/avant/releases/download/v0.9.0/avant-linux-x86_64.tar.gz
          tar -C /tmp -xzf /tmp/avant-seed.tar.gz
          test -x /tmp/avant-linux-x86_64/avant
          test -x /tmp/avant-linux-x86_64/myc-llvm

      - name: Seed → B
        run: |
          set -euo pipefail
          /tmp/avant-linux-x86_64/avant compile compiler/main.av bin/avant-av-b
          ./bin/avant-av-b run examples/hello.av

      - name: Native suite on B
        env:
          AVANT_COMPILER: ./bin/avant-av-b
        run: |
          set -euo pipefail
          ./bin/avant-av-b run tests/run.av | tee native.log
          if grep -q 'FAIL  tests/run.av' native.log; then
            exit 1
          fi
          if grep -qE 'Test Suites:.*failed' native.log; then
            exit 1
          fi
          grep -qE 'Test Suites: [0-9]+ passed, [0-9]+ total' native.log
          grep -q 'Ran all test suites.' native.log

      - name: Package linux-x86_64 B
        run: |
          set -euo pipefail
          mkdir -p dist/avant-linux-x86_64
          cp -f bin/avant-av-b dist/avant-linux-x86_64/avant
          cp -f /tmp/avant-linux-x86_64/myc-llvm dist/avant-linux-x86_64/myc-llvm
          chmod +x dist/avant-linux-x86_64/avant dist/avant-linux-x86_64/myc-llvm
          {
            echo "tag: ${TAG_NAME}"
            echo "avant: $(git rev-parse HEAD)"
            echo "myc-llvm: reused from v0.9.0 avant-linux-x86_64.tar.gz"
            if [ -f /tmp/avant-linux-x86_64/versions.txt ]; then
              echo "myc-llvm-origin:"
              sed 's/^/  /' /tmp/avant-linux-x86_64/versions.txt
            fi
            echo "llvm: $(llvm-config-20 --version)"
            echo "runner: ubuntu-24.04 linux-x86_64"
            echo "built-by: v0.9.0"
            echo "seed: yes"
            echo "binary: avant"
          } | tee dist/avant-linux-x86_64/versions.txt dist/versions.txt
          tar -C dist -czf dist/avant-linux-x86_64.tar.gz avant-linux-x86_64
          sha256sum dist/avant-linux-x86_64.tar.gz | tee dist/avant-linux-x86_64.tar.gz.sha256
          {
            echo "linux-x86_64 compiler \`avant\` and \`myc-llvm\`."
            echo
            echo "Built by the v0.9.0 seed. \`myc-llvm\` is the binary from that seed asset, reused unchanged. This asset can be the next pin after it is published. It is not the oracle."
            echo "Needs the source tree (\`runtime/\`, \`cc\`), LLVM 20, libpcre2, and re2c to compile programs."
            echo "A string literal at \`re_compile\` is compiled with re2c. A computed pattern uses PCRE2."
            echo "Set \`AVANT_MYC_LLVM\` to the extracted \`myc-llvm\`."
            echo
            cat dist/versions.txt
            echo
            echo '```'
            cat dist/avant-linux-x86_64.tar.gz.sha256
            echo '```'
          } > dist/notes.md

      - name: Attach to GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" \
              dist/avant-linux-x86_64.tar.gz \
              dist/avant-linux-x86_64.tar.gz.sha256 \
              --clobber
          else
            gh release create "${TAG_NAME}" \
              dist/avant-linux-x86_64.tar.gz \
              dist/avant-linux-x86_64.tar.gz.sha256 \
              --title "${TAG_NAME}" \
              --notes-file dist/notes.md \
              --draft \
              --verify-tag
          fi
