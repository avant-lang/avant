# Rust hyper row of the HTTP harness (bench/http/run.sh). Adapted from
# valk-lang/valk examples/bench/http/main.rs (commit 3322430, tag 0.8.5;
# MIT, (c) 2024 Lorenz Vandevelde): the dependencies, their features and the
# release profile are the ones that file's header lists, unchanged.
# Cargo.lock is committed, so the versions that resolved are fixed.
[package]
name = "rust_hyper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
